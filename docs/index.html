<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>少棒補位特訓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: night-game stadium — field diagram on the left, scoreboard-style coaching panel on the right; stacks on phones */
:root{
  --night:#0c1d16; --panel:#12291f; --line:#244636; --turf:#1e5737; --turf2:#23653f; --clay:#b47248;
  --chalk:#f2f0e6; --muted:#b3cbbc; --lamp:#ffc53d; --good:#5fd38d; --bad:#ff6b5b;
  --t-ball:#ffffff; --t-base:#6cb6ff; --t-cut:#ffc53d; --t-back:#5fd38d; --t-hold:#c3a8ff;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--display);font-size:17px;line-height:2.1;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;line-height:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* 注音：字的右邊一欄直排，聲調在右側，輕聲在最上面 */
.zy{display:inline-flex;align-items:center;vertical-align:middle;line-height:1}
.zy .bp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:max(.48em,9px);font-weight:500;line-height:1.02;margin-left:.06em;padding-right:.5em;position:relative}
.zy .bp .s{position:relative;display:block}
.zy .bp .tn{position:absolute;left:100%;top:50%;transform:translate(.05em,-55%);font-size:.95em}
.zy .bp .lt{display:block;line-height:.6}

.top{max-width:1180px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-weight:900;font-size:clamp(26px,4vw,36px);letter-spacing:.04em;line-height:1.5}
.brand p{margin:2px 0 0;color:var(--muted);font-size:16px}
.board{display:flex;gap:2px;background:var(--line);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.board div{background:#08140f;padding:6px 14px;text-align:center;min-width:80px}
.board small{display:block;font-size:13px;color:var(--muted);letter-spacing:.06em}
.board b{font-family:var(--num);font-size:26px;color:var(--lamp);line-height:1.3;font-variant-numeric:tabular-nums}

.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr)}}
.fieldwrap{min-width:0}
svg#field{width:100%;height:auto;display:block;max-height:80vh}
.legend{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:8px;font-size:15px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel h2{margin:0 0 8px;font-size:25px;font-weight:900;line-height:1.9}
.panel h3{margin:18px 0 8px;font-size:16px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.eyebrow{font-size:15px;letter-spacing:.06em;color:var(--lamp);font-weight:700}
.lead{color:var(--muted);margin:0 0 12px}

.rules{display:grid;gap:8px}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:#0c1f17}
.rule .k{font-size:20px;font-weight:900;min-width:4.6em}
.rule p{margin:0;font-size:16px}

.posgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pos{border:1px solid var(--line);background:#0c1f17;border-radius:8px;padding:8px 4px;text-align:center;transition:border-color .15s,background .15s}
.pos:hover{border-color:var(--lamp);background:#163527}
.pos .n{display:block;font-family:var(--num);font-size:15px;color:var(--muted);line-height:1.4}
.pos .nm{display:block;font-weight:700;font-size:18px}
.pos .best{display:block;font-size:14px;color:var(--good);min-height:20px;line-height:1.4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 22px;font-weight:900;font-size:20px;background:var(--lamp);color:#1a1300}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk);font-weight:700;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

.sit{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border-radius:8px;background:#0c1f17;margin-bottom:12px}
.sit p{margin:0}
.call{display:inline-block;margin-top:6px;font-size:15px;padding:2px 12px;border-radius:999px;border:1px solid var(--lamp);color:var(--lamp)}
.you{display:inline-flex;align-items:center;gap:8px;font-weight:700;margin:0}
.you i{width:14px;height:14px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 4px rgba(255,197,61,.25);flex:none}

.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#0c1f17;border-radius:10px;padding:8px 12px;font-size:19px;font-weight:700}
.opt:hover{border-color:var(--lamp)}
.opt .l{font-family:var(--num);font-size:21px;width:32px;height:32px;line-height:1;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--lamp);color:var(--lamp)}
.opt.ok{border-color:var(--good);background:#123a25}
.opt.no{border-color:var(--bad);background:#3a1a17}
.opt:disabled{cursor:default}

.verdict{font-size:28px;font-weight:900;margin:0 0 4px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.why{padding:12px;border-radius:8px;background:#0c1f17;margin:8px 0}
.why b{color:var(--lamp)}
.point{border-left:4px solid var(--lamp);padding:4px 0 4px 12px;margin:12px 0}
.team{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.team li{display:grid;grid-template-columns:12px 8.4em minmax(0,1fr);gap:8px;align-items:center;font-size:16px;padding:2px 6px;border-radius:6px}
.team li.me{background:#1d3a2b}
.team li i{width:11px;height:11px;border-radius:50%}
.team li .who{font-weight:700}

.recap{list-style:none;padding:0;margin:0;display:grid;gap:0;font-size:16px}
.recap li{display:flex;gap:8px;align-items:center}
.big{font-family:var(--num);font-size:64px;line-height:1.1;color:var(--lamp)}

.hint{font-size:15px;color:var(--muted);margin-top:10px}
svg .mk{cursor:pointer}
svg.picking .pl{cursor:pointer}
@keyframes pulse{0%{r:15;opacity:.9}100%{r:30;opacity:0}}
.ring{animation:pulse 1.4s ease-out infinite}
@keyframes spin{to{stroke-dashoffset:-20}}
.mk .dash{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.ring,.mk .dash{animation:none}}
</style>

<header class="top">
  <div class="brand">
    <h1>少棒補位特訓</h1>
    <p>球打出去，九個人都要動！</p>
  </div>
  <div class="board" aria-live="polite">
    <div><small>你的位置</small><b id="sbPos">—</b></div>
    <div><small>第幾題</small><b id="sbRound">0/10</b></div>
    <div><small>答對</small><b id="sbScore">0</b></div>
  </div>
</header>

<main class="app">
  <section class="fieldwrap">
    <svg id="field" viewBox="0 0 600 560" role="img" aria-label="棒球場"></svg>
    <div class="legend" id="legend">
      <span><i style="background:var(--t-ball)"></i>接球</span>
      <span><i style="background:var(--t-base)"></i>守壘包</span>
      <span><i style="background:var(--t-cut)"></i>當中間人</span>
      <span><i style="background:var(--t-back)"></i>當安全網</span>
      <span><i style="background:var(--t-hold)"></i>守好喊口令</span>
    </div>
  </section>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

  const ring = el('circle',{r:15,fill:'none',stroke:'var(--lamp)','stroke-width':3,class:'ring',visibility:'hidden'},g);
  const c = el('circle',{r:14,fill:'#0c1d16',stroke:'var(--chalk)','stroke-width':2.5},g);
  const t = el('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':14,'font-weight':700,fill:'var(--chalk)','font-family':'var(--display)'},g);
  t.textContent = SHORT[p];
  players[p] = {g,c,t,ring,x:HOME[p][0],y:HOME[p][1]};
  g.addEventListener('click',()=>{ if (state.mode==='pick') pickPos(p); });
  g.addEventListener('keydown',e=>{ if ((e.key==='Enter'||e.key===' ') && state.mode==='pick'){ e.preventDefault(); pickPos(p);} });
}
const place = (p,x,y) => { const o=players[p]; o.x=x; o.y=y; o.g.setAttribute('transform',`translate(${x} ${y})`); };
const setBall = (x,y,lift=0) => { ball.setAttribute('cx',x); ball.setAttribute('cy',y-lift); ballShadow.setAttribute('cx',x); ballShadow.setAttribute('cy',y+3); };
const showBall = v => { ball.setAttribute('visibility',v?'visible':'hidden'); ballShadow.setAttribute('visibility',v?'visible':'hidden'); };

/* ---------- animation ---------- */
let epoch = 0;
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const tween = (ms, fn) => new Promise(res => {
  const my = epoch;
  if (reduce) { fn(1); return res(); }
  const s = performance.now();
  const f = n => { if (my!==epoch) return res(); const t=Math.min(1,(n-s)/ms); fn(t); t<1 ? requestAnimationFrame(f) : res(); };
  requestAnimationFrame(f);
});
const lerp = (a,b,t) => a+(b-a)*t;
const dist = (a,b) => Math.hypot(a[0]-b[0],a[1]-b[1]);

function basePath(from,to){
  let i = ORDER.indexOf(from), j = to==='H' ? 4 : ORDER.indexOf(to);
  const pts = [];
  for (let k=i;k<=j;k++) pts.push(B[ORDER[k%4]]);
  return pts;
}
function along(pts,t){
  if (pts.length===1) return pts[0];
  const seg=[]; let tot=0;
  for (let i=1;i<pts.length;i++){ const d=dist(pts[i-1],pts[i]); seg.push(d); tot+=d; }
  let d=t*tot;
  for (let i=0;i<seg.length;i++){ if (d<=seg[i]||i===seg.length-1){ const u=seg[i]?Math.min(1,d/seg[i]):1; return [lerp(pts[i][0],pts[i+1][0],u),lerp(pts[i][1],pts[i+1][1],u)]; } d-=seg[i]; }
}

let runners = [];
function drawRunners(on){
  gRunners.innerHTML=''; runners=[];
  for (const b of on){ runners.push(makeRunner(b)); }
}
function makeRunner(b){
  const g=el('g',{},gRunners);
  el('circle',{r:9,fill:'#d94a3d',stroke:'#fff','stroke-width':2},g);
  const [x,y]=B[b]; g.setAttribute('transform',`translate(${x+10} ${y-10})`);
  return {g,base:b};
}

/* ---------- state ---------- */
const state = {mode:'pick',pos:null,idx:0,score:0,results:[]};
let best = {};
try { best = JSON.parse(localStorage.getItem('bb-backup-best')||'{}') || {}; } catch(e) { best = {}; }
const saveBest = () => { try { localStorage.setItem('bb-backup-best',JSON.stringify(best)); } catch(e){} };
const panel = document.getElementById('panel');
const setPanel = html => { panel.innerHTML = html; annotate(panel); };
const sb = () => {
  document.getElementById('sbPos').textContent = state.pos ? `${NUM[state.pos]} ${SHORT[state.pos]}` : '—';
  document.getElementById('sbRound').textContent = `${state.mode==='pick'?0:Math.min(state.idx+1,SC.length)}/${SC.length}`;
  document.getElementById('sbScore').textContent = state.score;
  annotate(document.querySelector('.board'));
};

function resetField(sc){
  epoch++;
  gTrails.innerHTML=''; gMarks.innerHTML='';
  for (const p of POS){ place(p,...HOME[p]); players[p].c.setAttribute('stroke','var(--chalk)'); players[p].c.setAttribute('fill','#0c1d16'); players[p].t.setAttribute('fill','var(--chalk)'); }
  highlight(state.pos);
  drawRunners(sc ? sc.on : []);
  showBall(false);
}
function highlight(pos){
  for (const p of POS){
    const me = p===pos;
    players[p].ring.setAttribute('visibility',me?'visible':'hidden');
    if (me){ players[p].c.setAttribute('fill','var(--lamp)'); players[p].c.setAttribute('stroke','var(--lamp)'); players[p].t.setAttribute('fill','#1a1300'); }
  }
}

/* ---------- screens ---------- */
function renderPick(){
  state.mode='pick'; state.pos=null; state.idx=0; state.score=0; state.results=[];
  svg.classList.add('picking');
  for (const p of POS){ players[p].g.setAttribute('tabindex',0); players[p].g.setAttribute('role','button'); players[p].g.setAttribute('aria-label',NAME[p]); }
  resetField(null); sb();
  setPanel(`
    <div class="eyebrow">第一步</div>
    <h2>你想當哪一個球員？</h2>
    <p class="lead">點一個球員。等一下球打出去，你要想一想：我要跑去哪裡？</p>
    <div class="posgrid">${POS.map(p=>`<button class="pos" data-p="${p}"><span class="n">${NUM[p]}</span><span class="nm">${NAME[p]}</span><span class="best">${best[p]!=null?`最好 ${best[p]}/${SC.length}`:''}</span></button>`).join('')}</div>
    <h3>球打出去，先想這三件事</h3>
    <div class="rules">
      <div class="rule"><span class="k" style="color:var(--t-ball)">1 接球</span><p>球往你這邊來，大聲喊「我的！」，去接。</p></div>
      <div class="rule"><span class="k" style="color:var(--t-base)">2 守壘包</span><p>壘包沒有人，就跑過去站好。</p></div>
      <div class="rule"><span class="k" style="color:var(--t-back)">3 安全網</span><p>跑到接球的人後面，球漏掉了，你把它擋下來。</p></div>
    </div>
    <p class="hint">當安全網的時候，不要站得太近喔！</p>`);
  panel.querySelectorAll('.pos').forEach(b=>b.addEventListener('click',()=>pickPos(b.dataset.p)));
}
function pickPos(p){
  state.pos=p; svg.classList.remove('picking');
  for (const q of POS){ players[q].g.setAttribute('tabindex',-1); players[q].g.removeAttribute('role'); }
  state.idx=0; state.score=0; state.results=[];
  renderIntro();
}
function miniDiamond(on){
  const sq=(x,y,b)=>`<rect x="${x-9}" y="${y-9}" width="18" height="18" transform="rotate(45 ${x} ${y})" fill="${on.includes(b)?'#d94a3d':'none'}" stroke="var(--chalk)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 64 56" width="64" height="56" aria-hidden="true">${sq(32,14,'2B')}${sq(50,32,'1B')}${sq(14,32,'3B')}<path d="M27,46 h10 v4 l-5,4 l-5,-4z" fill="var(--chalk)"/></svg>`;
}
function sitCard(sc){
  return `<div class="sit">${miniDiamond(sc.on)}<div><p>${sc.setup}</p><span class="call">大家一起喊：「${sc.call}」</span></div></div>`;
}
function renderIntro(){
  const sc=SC[state.idx]; state.mode='intro';
  resetField(sc); sb();
  setPanel(`
    <div class="eyebrow">第 ${state.idx+1} 題（共 ${SC.length} 題）</div>
    <h2>${sc.title}</h2>
    ${sitCard(sc)}
    <p class="you"><i></i>你是 ${NUM[state.pos]} 號${NAME[state.pos]}</p>
    <div class="row"><button class="btn" id="go">開打 ▶</button></div>
    <p class="hint">看看球往哪裡飛！</p>`);
  const go=document.getElementById('go'); go.focus({preventScroll:true});
  go.addEventListener('click',()=>{ go.disabled=true; playHit(sc).then(()=>renderChoose(sc)); });
}
async function playHit(sc){
  const m=[300,392], h=[300,466];
  setBall(...m); showBall(true);
  await tween(380,t=>setBall(lerp(m[0],h[0],t),lerp(m[1],h[1],t)));
  const to=sc.hit.to, k=sc.hit.kind;
  if (k==='pitch') return;
  const ms = k==='fly'?1100 : k==='bunt'?650 : 750;
  const peak = k==='fly'?120 : k==='line'?28 : 0;
  await tween(ms,t=>{ const u=k==='bunt'||k==='ground'?1-Math.pow(1-t,2):t; setBall(lerp(h[0],to[0],u),lerp(h[1],to[1],u),peak*Math.sin(Math.PI*t)); ball.setAttribute('r',5.5+(peak?peak/40:0)*Math.sin(Math.PI*t)); });
  ball.setAttribute('r',5.5);
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildOptions(sc){
  const mine=sc.roles[state.pos]; const picked=[{...mine,correct:true}];
  const others=shuffle(POS.filter(p=>p!==state.pos).map(p=>sc.roles[p]));
  for (const o of others){
    if (picked.length>=4) break;
    if (picked.every(q=>dist([q.x,q.y],[o.x,o.y])>34 && q.act!==o.act)) picked.push({...o,correct:false});
  }
  return shuffle(picked).map((o,i)=>({...o,letter:'ABCD'[i]}));
}
function renderChoose(sc){
  state.mode='choose';
  const opts=buildOptions(sc);
  gMarks.innerHTML='';
  opts.forEach(o=>{
    const g=el('g',{class:'mk',transform:`translate(${o.x} ${o.y})`},gMarks);
    el('circle',{r:26,fill:'transparent'},g);
    el('circle',{r:17,fill:'rgba(12,29,22,.75)',stroke:'var(--lamp)','stroke-width':2.5,'stroke-dasharray':'5 5',class:'dash'},g);
    const t=el('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':17,'font-weight':700,fill:'var(--lamp)','font-family':'var(--num)'},g); t.textContent=o.letter;
    g.addEventListener('click',()=>answer(sc,opts,o));
    o.g=g;
  });
  setPanel(`
    <div class="eyebrow">第 ${state.idx+1} 題・球打出去了！</div>
    <h2>${NAME[state.pos]}，你要跑去哪裡？</h2>
    ${sitCard(sc)}
    <div class="opts">${opts.map(o=>`<button class="opt" data-l="${o.letter}"><span class="l">${o.letter}</span><span>${o.act}</span></button>`).join('')}</div>
    <p class="hint">點按鈕，或點球場上的 A、B、C、D。</p>`);
  panel.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(sc,opts,opts.find(o=>o.letter===b.dataset.l))));
  panel.querySelector('.opt').focus({preventScroll:true});
}
let answering=false;
async function answer(sc,opts,o){
  if (state.mode!=='choose' || answering) return;
  answering=true; state.mode='reveal';
  const ok=o.correct; if (ok) state.score++;
  state.results.push({title:sc.title,ok});
  sb();
  panel.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const oo=opts.find(x=>x.letter===b.dataset.l); if (oo.correct) b.classList.add('ok'); else if (oo===o) b.classList.add('no'); });
  opts.forEach(x=>{ if (!x.correct && x!==o) x.g.remove(); else { const c=x.g.querySelectorAll('circle')[1]; c.classList.remove('dash'); c.setAttribute('stroke',x.correct?'var(--good)':'var(--bad)'); c.setAttribute('stroke-dasharray','none'); x.g.querySelector('text').setAttribute('fill',x.correct?'var(--good)':'var(--bad)'); } });
  await reveal(sc);
  answering=false;
  renderResult(sc,ok,o);
}
async function reveal(sc){
  const start={}; for (const p of POS) start[p]=[players[p].x,players[p].y];
  const rs = sc.runs.map(([f,t])=>{ let rn = f==='H' ? makeRunner('H') : runners.find(x=>x.base===f); return {rn,path:basePath(f,t)}; });
  for (const p of POS){ if (p!==state.pos) players[p].c.setAttribute('stroke',TYPE[sc.roles[p].type]); }
  const moveP = tween(1100,t=>{ const u=ease(t); for (const p of POS){ const d=sc.roles[p]; place(p,lerp(start[p][0],d.x,u),lerp(start[p][1],d.y,u)); } });
  const moveR = tween(1500,t=>{ for (const {rn,path} of rs){ const [x,y]=along(path,t); rn.g.setAttribute('transform',`translate(${x+10} ${y-10})`); } });
  await moveP;
  for (const [a,b] of sc.throws){
    const line=el('line',{x1:a[0],y1:a[1],x2:a[0],y2:a[1],stroke:'#fff','stroke-width':2,'stroke-dasharray':'4 5',opacity:.7},gTrails);
    await tween(Math.max(260,dist(a,b)*2.2),t=>{ const x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t); setBall(x,y,10*Math.sin(Math.PI*t)); line.setAttribute('x2',x); line.setAttribute('y2',y); });
  }
  await moveR;
}
function renderResult(sc,ok,o){
  const mine=sc.roles[state.pos];
  const last = state.idx===SC.length-1;
  setPanel(`
    <div class="eyebrow">第 ${state.idx+1} 題・${sc.title}</div>
    <p class="verdict ${ok?'ok':'no'}">${ok?'答對了！好棒！':'再想想看！'}</p>
    ${ok?'':`<p class="lead">「${o.act}」是別的隊友要做的事。</p>`}
    <div class="why"><b>${NAME[state.pos]}要：${mine.act}</b><br>${mine.why}</div>
    <div class="point">${sc.point}</div>
    <h3>大家都在做什麼？</h3>
    <ul class="team">${POS.map(p=>{ const d=sc.roles[p]; return `<li class="${p===state.pos?'me':''}"><i style="background:${TYPE[d.type]}"></i><span class="who">${NAME[p]}</span><span>${d.act}</span></li>`; }).join('')}</ul>
    <div class="row"><button class="btn" id="next">${last?'看成績 ▶':'下一題 ▶'}</button><button class="btn ghost" id="replay">再看一次</button></div>`);
  const nx=document.getElementById('next'); nx.focus({preventScroll:true});
  nx.addEventListener('click',()=>{ if (last) renderEnd(); else { state.idx++; renderIntro(); } });
  document.getElementById('replay').addEventListener('click',async e=>{
    const b=e.currentTarget; b.disabled=true;
    const keep=[...gMarks.childNodes];
    resetField(sc); keep.forEach(n=>gMarks.appendChild(n));
    await playHit(sc); await reveal(sc); b.disabled=false;
  });
}
function renderEnd(){
  state.mode='end'; sb();
  const p=state.pos, s=state.score;
  if (best[p]==null || s>best[p]) { best[p]=s; saveBest(); }
  const msg = s===SC.length ? '全部答對！你是補位小達人！' : s>=7 ? '好厲害！你已經很會補位了！' : s>=4 ? '不錯喔！再玩一次會更好！' : '沒關係，多玩幾次就會了！';
  setPanel(`
    <div class="eyebrow">完成了！${NUM[p]} 號${NAME[p]}</div>
    <div class="big">${s}<span style="font-size:28px;color:var(--muted)"> / ${SC.length}</span></div>
    <h2>${msg}</h2>
    <ul class="recap">${state.results.map((x,i)=>`<li><span style="color:${x.ok?'var(--good)':'var(--bad)'}">${x.ok?'✓':'✗'}</span>${i+1}. ${x.title}</li>`).join('')}</ul>
    <h3>記住這四句話</h3>
    <div class="rules">
      <div class="rule"><span class="k" style="color:var(--lamp)">動</span><p>球打出去，大家都要動！</p></div>
      <div class="rule"><span class="k" style="color:var(--t-back)">排</span><p>站到接球的人後面，排成一直線。</p></div>
      <div class="rule"><span class="k" style="color:var(--t-base)">補</span><p>壘包沒有人，就要有人去守。</p></div>
      <div class="rule"><span class="k" style="color:var(--t-cut)">喊</span><p>大聲喊出來，隊友才知道。</p></div>
    </div>
    <div class="row"><button class="btn" id="again">再玩一次</button><button class="btn ghost" id="switch">換一個位置</button></div>`);
  document.getElementById('again').addEventListener('click',()=>pickPos(p));
  document.getElementById('switch').addEventListener('click',renderPick);
  document.getElementById('again').focus({preventScroll:true});
}

annotate(document.querySelector('.brand'));
annotate(document.getElementById('legend'));
renderPick();
})();
</script>

</body>
</html>
